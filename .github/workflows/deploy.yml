name: 部署到GitHub Pages

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      # 必须在 setup-node 之前：cache: 'pnpm' 需要 pnpm 已可用才能定位缓存目录。
      # 版本取自 package.json 的 packageManager 字段，与本地保持一致。
      - name: 设置pnpm
        uses: pnpm/action-setup@v4

      # Node 22：jsdom@30 声明 engines 为 ^22.22.2 || ^24.15.0 || >=26.0.0，
      # 它依赖的 undici@8 会调用 Node 22 才有的 webidl.util.markAsUncloneable。
      # 用 Node 20 时 jsdom 一加载就抛 TypeError，DevelopmentView 的 SFC 挂载测试
      # 整个文件无法运行（表现为 16/17 文件通过、少 4 条测试）。
      # 版本要求同时写进了 package.json 的 engines，两处需保持一致。
      - name: 设置Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      # --frozen-lockfile：锁文件与 package.json 不一致时直接失败，
      # 而不是就地改锁文件——CI 装出来的依赖必须与本地锁定的完全一致。
      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 类型检查
        run: pnpm type-check

      - name: 测试
        run: pnpm test

      - name: 构建
        run: pnpm build-only

      - name: 设置Pages
        uses: actions/configure-pages@v4

      - name: 上传构件
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: 部署到GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
